
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Studio</title>

<style>
:root {
  --bg: #070b14;
  --white: #fff;
  --blue: #2f8bff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  background: var(--bg);
  font-family: Inter, Arial, sans-serif;
}

main {
  width: min(96vw, 1000px);
  text-align: center;
}

.logo {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.ink {
  fill: none;
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: var(--len, 1000);
  stroke-dashoffset: var(--len, 1000);
}

.white-ink {
  stroke: var(--white);
}

.blue-ink {
  stroke: var(--blue);
}

/* Tagline sát phần nét vẽ của logo */
.caption {
  margin-top: -1px;
  color: #8b9ab4;
  font-size: 9px;
  line-height: 1.4;
  letter-spacing: 3px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .5s ease;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 24px;
  padding: 0 8px;
}

button {
  padding: 11px 16px;
  color: #fff;
  background: #101a2c;
  border: 1px solid #283954;
  border-radius: 9px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
}

button:hover {
  border-color: var(--blue);
  background: #14213a;
}

button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

@media (max-width: 600px) {
  .caption {
    margin-top: -1px;
    font-size: 8px;
    letter-spacing: 2px;
  }

  .actions {
    gap: 8px;
    margin-top: 20px;
  }

  button {
    padding: 10px 12px;
    font-size: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .caption,
  button {
    transition: none;
  }
}
</style>
</head>

<body>
<main>

<svg id="logo" class="logo"

      <path class="ink blue-ink" data-start="3.9"

      <!-- d -->
      <path class="ink blue-ink" data-start="4.55"
        d="M743 112

      <!-- Thân i -->

      <!-- Chấm i -->

        cx="773" cy="68" r="4"

        opacity="0"/>

      <!-- o cuối -->
      <path class="ink blue-ink" data-start="5.85"

  </g>
</svg>

<div id="caption" class="caption">
  CREATING · EXPLORING · SHARING
</div>

<div class="actions">
  <button id="downloadBg" type="button">
    ↓ Tải PNG có nền
  </button>

  <button id="downloadTransparent" type="button">
    ↓ Tải PNG trong suốt
  </button>

  <button id="replay" type="button">
    ↻ Vẽ lại logo
  </button>
</div>

</main>

<script>
const svg = document.getElementById("logo");
const paths = [...document.querySelectorAll("#drawing .ink")];
const iStem = document.getElementById("iStem");
const iDot = document.getElementById("iDot");
const caption = document.getElementById("caption");

const replay = document.getElementById("replay");
const downloadBg = document.getElementById("downloadBg");
const downloadTransparent =
  document.getElementById("downloadTransparent");

let frame = 0;
let runId = 0;

const duration = 650;
const timeScale = 1000;

function animateLogo() {
  const thisRun = ++runId;

  cancelAnimationFrame(frame);

  caption.style.opacity = "0";
  iDot.setAttribute("opacity", "0");

  const items = paths.map(path => {
    const length = path.getTotalLength();

    path.style.setProperty("--len", length);
    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;

    return {
      path,
      length,
      start: Number(path.dataset.start) * timeScale
    };
  });

  const total = Math.max(
    ...items.map(item => item.start + duration)
  );

  const stemEnd =
    Number(iStem.dataset.start) * timeScale + duration;

  const startTime = performance.now();
  let dotShown = false;

  function tick(now) {
    if (thisRun !== runId) return;

    const elapsed = now - startTime;

    for (const item of items) {
      const progress = Math.max(
        0,
        Math.min(1, (elapsed - item.start) / duration)
      );

      const eased =
        progress * progress * (3 - 2 * progress);

      item.path.style.strokeDashoffset =
        item.length * (1 - eased);
    }

    if (!dotShown && elapsed >= stemEnd + 180) {
      iDot.setAttribute("opacity", "1");
      dotShown = true;
    }

    if (elapsed < total + 250) {
      frame = requestAnimationFrame(tick);
    } else {
      finishLogo(thisRun);
    }
  }

  frame = requestAnimationFrame(tick);
}

function finishLogo(run) {
  if (run !== runId) return;

  paths.forEach(path => {
    path.style.strokeDashoffset = "0";
  });

  iDot.setAttribute("opacity", "1");
  caption.style.opacity = "1";
}

/*
 * Tạo một SVG độc lập để xuất PNG.
 * Giữ nguyên các nét logo và thêm tagline vào ảnh.
 */
function createExportSvg(withBackground) {
  const clone = svg.cloneNode(true);

  clone.removeAttribute("class");
  clone.removeAttribute("id");
  clone.setAttribute("width", "1000");
  clone.setAttribute("height", "192");
  clone.setAttribute("viewBox", "0 0 1000 192");

  clone.querySelectorAll(".ink").forEach(path => {
    const isBlue = path.classList.contains("blue-ink");

    path.setAttribute("fill", "none");
    path.setAttribute("stroke", isBlue ? "#2f8bff" : "#ffffff");
    path.setAttribute("stroke-width", "7");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    path.setAttribute("stroke-dasharray", "none");
    path.setAttribute("stroke-dashoffset", "0");
    path.style.strokeDasharray = "none";
    path.style.strokeDashoffset = "0";
  });

  const dot = clone.querySelector("#iDot");
  dot.setAttribute("opacity", "1");

  if (withBackground) {
    const background = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

    background.setAttribute("x", "0");
    background.setAttribute("y", "0");
    background.setAttribute("width", "1000");
    background.setAttribute("height", "192");
    background.setAttribute("fill", "#070b14");

    clone.insertBefore(background, clone.firstChild);
  }

  const tagline = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "text"
  );

  tagline.setAttribute("x", "500");
  tagline.setAttribute("y", "184");
  tagline.setAttribute("text-anchor", "middle");
  tagline.setAttribute("fill", "#8b9ab4");
  tagline.setAttribute("font-family", "Inter, Arial, sans-serif");
  tagline.setAttribute("font-size", "9.4");
  tagline.setAttribute("letter-spacing", "3.1");

  tagline.textContent = "CREATING · EXPLORING · SHARING";
  clone.appendChild(tagline);

  return clone;
}

function downloadPng(withBackground) {
  const clone = createExportSvg(withBackground);
  const source = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob(
    [source],
    { type: "image/svg+xml;charset=utf-8" }
  );

  const objectUrl = URL.createObjectURL(svgBlob);
  const image = new Image();

  image.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = 2000;
    canvas.height = 384;

    const ctx = canvas.getContext("2d");

    if (!ctx) {
      URL.revokeObjectURL(objectUrl);
      alert("Không thể tạo ảnh trên trình duyệt này.");
      return;
    }

    if (withBackground) {
      ctx.fillStyle = "#070b14";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(objectUrl);

    canvas.toBlob(blob => {
      if (!blob) {
        alert("Tạo PNG thất bại. Hãy thử lại nhé.");
        return;
      }

      const pngUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = pngUrl;
      link.download = withBackground
        ? "moon-studio.png"
        : "moon-studio-transparent.png";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
    }, "image/png");
  };

  image.onerror = () => {
    URL.revokeObjectURL(objectUrl);
    alert("Không thể tạo ảnh. Hãy thử lại nhé.");
  };

  image.src = objectUrl;
}

replay.addEventListener("click", animateLogo);

downloadBg.addEventListener("click", () => {
  downloadPng(true);
});

downloadTransparent.addEventListener("click", () => {
  downloadPng(false);
});

animateLogo();
</script>
</body>
</html>
