<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Moon Studio — Khoa học tự nhiên 6</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #pptx-app {
      width: 100%;
      height: 700px;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #050912;
      color: #fff;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
    }

    #toolbar {
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: #080d18;
      border-bottom: 1px solid rgba(255,255,255,.08);
      gap: 8px;
    }

    #brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #brand-dot {
      width: 9px;
      height: 9px;
      background: #3b82f6;
      flex-shrink: 0;
    }

    #brand-text {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #toolbar-buttons {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    button {
      font-family: Arial, sans-serif;
    }

    .ctrl-btn,
    #openFile {
      border: 1px solid rgba(255,255,255,.12);
      background: #101827;
      color: #fff;
      height: 34px;
      padding: 0 12px;
      cursor: pointer;
      font-size: 12px;
      border-radius: 4px;
    }

    .ctrl-btn:hover,
    #openFile:hover {
      background: #162033;
      border-color: rgba(59,130,246,.45);
    }

    .ctrl-btn:active,
    #openFile:active {
      transform: translateY(1px);
    }

    #zoomOut,
    #zoomIn {
      min-width: 38px;
      font-size: 16px;
    }

    #fullscreen {
      min-width: 38px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fileInput {
      display: none;
    }

    #viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          45deg,
          rgba(255,255,255,.015) 25%,
          transparent 25%,
          transparent 75%,
          rgba(255,255,255,.015) 75%
        );
      background-size: 22px 22px;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 94%;
      max-width: 1200px;
      height: 88%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform .15s ease;
    }

    #slide {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
      box-shadow: 0 25px 80px rgba(0,0,0,.5);
      user-select: none;
    }

    #dropzone {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(5,9,18,.92);
      z-index: 8;
      cursor: pointer;
    }

    #dropzone.dragover {
      background: rgba(29,78,216,.15) !important;
    }

    #drop-icon {
      width: 72px;
      height: 72px;
      border: 2px dashed rgba(59,130,246,.5);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #drop-title {
      font-family: 'Pixelify Sans', monospace;
      font-size: 20px;
      margin-bottom: 6px;
    }

    #drop-description {
      font-size: 13px;
      color: #8b95a7;
      text-align: center;
    }

    #drop-description strong {
      color: #3b82f6;
    }

    #dropzone-status {
      font-size: 12px;
      color: #5a6478;
      max-width: 90%;
      text-align: center;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050912;
      z-index: 10;
    }

    #loading-text {
      font-family: 'Pixelify Sans', monospace;
      font-size: 18px;
      color: #fff;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
      100% { content: ""; }
    }

    #loading-text::after {
      content: "";
      animation: dots 1.2s infinite steps(4);
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #050912;
      z-index: 20;
    }

    #error-box {
      max-width: 520px;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.1);
      background: #0b1220;
      border-radius: 10px;
    }

    #error-title {
      font-family: 'Pixelify Sans', monospace;
      font-size: 21px;
      margin-bottom: 12px;
      color: #f87171;
    }

    #errorMessage {
      color: #aeb8c8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
      word-break: break-word;
    }

    #errorRetry {
      border: 1px solid rgba(59,130,246,.5);
      background: #1d4ed8;
      color: #fff;
      height: 36px;
      padding: 0 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
    }

    #errorRetry:hover {
      background: #2563eb;
    }

    #navigation {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }

    .nav-btn {
      width: 42px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(8,13,24,.92);
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      border-radius: 4px;
    }

    .nav-btn:hover {
      background: #162033;
    }

    #counter {
      min-width: 75px;
      padding: 8px 12px;
      text-align: center;
      background: rgba(8,13,24,.92);
      border: 1px solid rgba(255,255,255,.12);
      font-family: 'Pixelify Sans', monospace;
      font-size: 13px;
      border-radius: 4px;
    }

    #slide text {
      font-family: 'Pixelify Sans', monospace;
    }

    @media (max-width: 700px) {
      #pptx-app {
        height: 100vh;
        border-radius: 0;
      }

      #toolbar {
        height: 52px;
        padding: 0 8px;
      }

      #brand-text {
        max-width: 130px;
      }

      #toolbar-buttons {
        gap: 4px;
      }

      .ctrl-btn,
      #openFile {
        padding: 0 8px;
      }

      #openFile {
        font-size: 11px;
      }

      #zoomReset {
        display: none;
      }

      #stage {
        width: 96%;
        height: 82%;
      }

      #navigation {
        bottom: 10px;
      }
    }
  </style>
</head>

<body>

<div id="pptx-app">

  <div id="toolbar">

    <div id="brand">
      <div id="brand-dot"></div>
      <div id="brand-text">
        Moon Studio — Khoa học tự nhiên 6
      </div>
    </div>

    <div id="toolbar-buttons">

      <button id="openFile">
        Mở file
      </button>

      <button id="zoomOut" class="ctrl-btn">
        −
      </button>

      <button id="zoomReset" class="ctrl-btn">
        100%
      </button>

      <button id="zoomIn" class="ctrl-btn">
        +
      </button>

      <button id="fullscreen" class="ctrl-btn" title="Toàn màn hình">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>

      <input
        type="file"
        id="fileInput"
        accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation"
      >

    </div>
  </div>

  <div id="viewport">

    <div id="stage">

      <svg
        id="slide"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 960 540"
        preserveAspectRatio="xMidYMid meet"
      ></svg>

    </div>

    <div id="dropzone">

      <div id="drop-icon">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#3b82f6"
          stroke-width="1.8"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M17 8l-5-5-5 5"/>
          <path d="M12 3v12"/>
        </svg>
      </div>

      <div style="text-align:center;">
        <div id="drop-title">
          Không tải được từ URL
        </div>

        <div id="drop-description">
          Kéo thả file .pptx vào đây hoặc nhấn
          <strong>Mở file</strong>
        </div>
      </div>

      <div id="dropzone-status"></div>

    </div>

    <div id="loading">
      <div id="loading-text">
        Đang tải PPTX
      </div>
    </div>

    <div id="error">

      <div id="error-box">

        <div id="error-title">
          Không thể mở slide
        </div>

        <div id="errorMessage"></div>

        <button id="errorRetry">
          Mở file từ máy
        </button>

      </div>

    </div>

    <div id="navigation">

      <button id="previous" class="nav-btn">
        ◀
      </button>

      <div id="counter">
        0 / 0
      </div>

      <button id="next" class="nav-btn">
        ▶
      </button>

    </div>

  </div>

</div>

<script>
(function () {

  'use strict';

  /*
   * ==============================
   * CONFIG
   * ==============================
   */

  var PPTX_URL =
    'https://moonstudio.us.ci/khoahoctunhien6.pptx';

  var PPTX_FILENAME =
    'khoahoctunhien6.pptx';

  var RELS_NS =
    'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  var EMU_PER_INCH =
    914400;

  var DPI =
    96;

  /*
   * ==============================
   * STATE
   * ==============================
   */

  var zip = null;

  var slides = [];

  var currentSlide = 0;

  var zoom = 1;

  var slideW = 960;

  var slideH = 540;

  /*
   * ==============================
   * ELEMENTS
   * ==============================
   */

  function $(id) {
    return document.getElementById(id);
  }

  var svg = $('slide');

  var stage = $('stage');

  /*
   * ==============================
   * HELPERS
   * ==============================
   */

  function emuToPx(value) {

    return (
      Number(value || 0) /
      EMU_PER_INCH
    ) * DPI;

  }

  function attr(node, name) {

    return node
      ? node.getAttribute(name)
      : null;

  }

  function attrR(node) {

    if (!node) {
      return null;
    }

    return (
      node.getAttributeNS(RELS_NS, 'id') ||
      node.getAttribute('r:id') ||
      node.getAttribute('id')
    );

  }

  function xmlDoc(text) {

    return new DOMParser()
      .parseFromString(text, 'application/xml');

  }

  function byTag(node, name) {

    return node
      ? node.getElementsByTagNameNS('*', name)
      : [];

  }

  async function getXml(path) {

    if (!zip) {
      return null;
    }

    var file = zip.file(path);

    if (!file) {
      return null;
    }

    return await file.async('text');

  }

  /*
   * ==============================
   * UI
   * ==============================
   */

  function showLoading(message) {

    $('loading-text').textContent =
      message || 'Đang tải PPTX';

    $('loading').style.display =
      'flex';

    $('error').style.display =
      'none';

    $('dropzone').style.display =
      'none';

  }

  function hideLoading() {

    $('loading').style.display =
      'none';

  }

  function showError(message) {

    hideLoading();

    $('dropzone').style.display =
      'none';

    $('errorMessage').textContent =
      message || 'Có lỗi xảy ra.';

    $('error').style.display =
      'flex';

  }

  function showDropzone(message) {

    hideLoading();

    $('error').style.display =
      'none';

    $('dropzone-status').textContent =
      message || '';

    $('dropzone').style.display =
      'flex';

  }

  /*
   * ==============================
   * PATH RESOLVER
   * ==============================
   */

  function resolvePath(base, target) {

    if (!target) {
      return null;
    }

    if (
      target.indexOf('http://') === 0 ||
      target.indexOf('https://') === 0
    ) {
      return target;
    }

    var parts =
      base.split('/');

    parts.pop();

    var targetParts =
      target.split('/');

    for (
      var i = 0;
      i < targetParts.length;
      i++
    ) {

      var part =
        targetParts[i];

      if (
        !part ||
        part === '.'
      ) {
        continue;
      }

      if (part === '..') {
        parts.pop();
      } else {
        parts.push(part);
      }

    }

    return parts.join('/');

  }

  /*
   * ==============================
   * PRESENTATION
   * ==============================
   */

  async function readPresentation() {

    var xml =
      await getXml(
        'ppt/presentation.xml'
      );

    if (!xml) {

      throw new Error(
        'Không tìm thấy presentation.xml trong file PPTX.'
      );

    }

    var doc =
      xmlDoc(xml);

    var sldSz =
      byTag(doc, 'sldSz')[0];

    if (sldSz) {

      var cx =
        emuToPx(
          attr(sldSz, 'cx')
        );

      var cy =
        emuToPx(
          attr(sldSz, 'cy')
        );

      if (cx && cy) {

        slideW = cx;

        slideH = cy;

        svg.setAttribute(
          'viewBox',
          '0 0 ' +
          cx +
          ' ' +
          cy
        );

      }

    }

  }

  async function getSlidePaths() {

    var presentationXml =
      await getXml(
        'ppt/presentation.xml'
      );

    var relationshipsXml =
      await getXml(
        'ppt/_rels/presentation.xml.rels'
      );

    if (
      !presentationXml ||
      !relationshipsXml
    ) {

      throw new Error(
        'File PPTX bị hỏng hoặc thiếu thành phần cần thiết.'
      );

    }

    var pdoc =
      xmlDoc(presentationXml);

    var rdoc =
      xmlDoc(relationshipsXml);

    var rels =
      new Map();

    var relNodes =
      byTag(
        rdoc,
        'Relationship'
      );

    for (
      var i = 0;
      i < relNodes.length;
      i++
    ) {

      rels.set(
        attr(relNodes[i], 'Id'),
        attr(relNodes[i], 'Target')
      );

    }

    var list =
      byTag(
        pdoc,
        'sldIdLst'
      )[0];

    if (!list) {
      return [];
    }

    var result = [];

    var children =
      list.children;

    for (
      var j = 0;
      j < children.length;
      j++
    ) {

      var rid =
        attrR(children[j]);

      var target =
        rels.get(rid);

      if (!target) {
        continue;
      }

      var path =
        target;

      path =
        path.replace(/^\/+/, '');

      if (
        path.indexOf('ppt/') !== 0
      ) {

        path =
          'ppt/' + path;

      }

      result.push(path);

    }

    return result;

  }

  /*
   * ==============================
   * SLIDE RELATIONSHIPS
   * ==============================
   */

  async function getSlideRels(slidePath) {

    var parts =
      slidePath.split('/');

    var filename =
      parts.pop();

    var folder =
      parts.join('/');

    var relPath =
      folder +
      '/_rels/' +
      filename +
      '.rels';

    var xml =
      await getXml(relPath);

    if (!xml) {
      return new Map();
    }

    var doc =
      xmlDoc(xml);

    var map =
      new Map();

    var nodes =
      byTag(
        doc,
        'Relationship'
      );

    for (
      var i = 0;
      i < nodes.length;
      i++
    ) {

      map.set(
        attr(nodes[i], 'Id'),
        attr(nodes[i], 'Target')
      );

    }

    return map;

  }

  /*
   * ==============================
   * TRANSFORM
   * ==============================
   */

  function getTransform(shape) {

    var xfrm =
      byTag(shape, 'xfrm')[0];

    if (!xfrm) {

      return {
        x: 0,
        y: 0,
        w: 100,
        h: 100
      };

    }

    var off =
      byTag(xfrm, 'off')[0];

    var ext =
      byTag(xfrm, 'ext')[0];

    return {

      x: emuToPx(
        attr(off, 'x')
      ),

      y: emuToPx(
        attr(off, 'y')
      ),

      w: emuToPx(
        attr(ext, 'cx')
      ),

      h: emuToPx(
        attr(ext, 'cy')
      )

    };

  }

  /*
   * ==============================
   * COLORS
   * ==============================
   */

  function getFillColor(node) {

    if (!node) {
      return null;
    }

    var solid =
      byTag(
        node,
        'solidFill'
      )[0];

    if (!solid) {
      return null;
    }

    var srgb =
      byTag(
        solid,
        'srgbClr'
      )[0];

    if (srgb) {

      return '#' +
        (
          attr(srgb, 'val') ||
          'ffffff'
        );

    }

    var scheme =
      byTag(
        solid,
        'schemeClr'
      )[0];

    if (scheme) {

      var map = {

        tx1: '111111',

        bg1: 'ffffff',

        tx2: '1f3864',

        bg2: 'e7e6e6',

        accent1: '2e75b6',

        accent2: 'ed7d31',

        accent3: 'a5a5a5',

        accent4: 'ffc000',

        accent5: '5b9bd5',

        accent6: '70ad47'

      };

      return (
        '#' +
        (
          map[
            attr(scheme, 'val')
          ] || '333333'
        )
      );

    }

    return null;

  }

  /*
   * ==============================
   * TEXT STYLE
   * ==============================
   */

  function getRunStyle(rPr) {

    var size =
      Number(
        attr(rPr, 'sz')
      );

    var fontSize =
      size
        ? size / 100
        : 18;

    var color =
      '#111111';

    var fill =
      getFillColor(rPr);

    if (fill) {
      color = fill;
    }

    return {

      size: fontSize,

      color: color,

      bold:
        attr(rPr, 'b') === '1',

      italic:
        attr(rPr, 'i') === '1'

    };

  }

  /*
   * ==============================
   * TEXT RENDER
   * ==============================
   */

  function renderTextShape(
    svgEl,
    shape,
    x,
    y,
    w,
    h
  ) {

    var txBody =
      byTag(
        shape,
        'txBody'
      )[0];

    if (!txBody) {
      return;
    }

    var paragraphs =
      txBody.children;

    var curY =
      y;

    for (
      var pi = 0;
      pi < paragraphs.length;
      pi++
    ) {

      var p =
        paragraphs[pi];

      if (
        p.localName !== 'p'
      ) {
        continue;
      }

      var runs =
        p.children;

      var maxSize =
        18;

      var spans = [];

      var curX =
        x;

      for (
        var ri = 0;
        ri < runs.length;
        ri++
      ) {

        var run =
          runs[ri];

        if (
          run.localName !== 'r'
        ) {
          continue;
        }

        var textNode =
          byTag(
            run,
            't'
          )[0];

        if (!textNode) {
          continue;
        }

        var text =
          textNode.textContent || '';

        var rPr =
          byTag(
            run,
            'rPr'
          )[0];

        var style =
          rPr
            ? getRunStyle(rPr)
            : {
                size: 18,
                color: '#111111',
                bold: false,
                italic: false
              };

        maxSize =
          Math.max(
            maxSize,
            style.size
          );

        spans.push({

          text: text,

          style: style,

          x: curX

        });

        /*
         * Approximate text width.
         */
        curX +=
          text.length *
          style.size *
          0.52;

      }

      var lineHeight =
        maxSize * 1.3;

      for (
        var si = 0;
        si < spans.length;
        si++
      ) {

        var span =
          spans[si];

        if (!span.text) {
          continue;
        }

        var textElement =
          document.createElementNS(
            'http://www.w3.org/2000/svg',
            'text'
          );

        textElement.setAttribute(
          'x',
          span.x
        );

        textElement.setAttribute(
          'y',
          curY + maxSize
        );

        textElement.setAttribute(
          'font-size',
          span.style.size
        );

        textElement.setAttribute(
          'fill',
          span.style.color
        );

        if (span.style.bold) {

          textElement.setAttribute(
            'font-weight',
            '700'
          );

        }

        if (span.style.italic) {

          textElement.setAttribute(
            'font-style',
            'italic'
          );

        }

        textElement.textContent =
          span.text;

        svgEl.appendChild(
          textElement
        );

      }

      curY += lineHeight;

    }

  }

  /*
   * ==============================
   * IMAGE RENDER
   * ==============================
   */

  async function renderPic(
    svgEl,
    pic,
    relsMap,
    slidePath
  ) {

    var blip =
      byTag(
        pic,
        'blip'
      )[0];

    if (!blip) {
      return;
    }

    var embed =
      blip.getAttributeNS(
        RELS_NS,
        'embed'
      ) ||
      blip.getAttribute(
        'r:embed'
      );

    if (!embed) {
      return;
    }

    var target =
      relsMap.get(embed);

    if (!target) {
      return;
    }

    var imgPath =
      resolvePath(
        slidePath,
        target
      );

    if (!imgPath) {
      return;
    }

    var imgFile =
      zip.file(imgPath);

    if (!imgFile) {
      return;
    }

    var base64 =
      await imgFile.async(
        'base64'
      );

    var ext =
      imgPath
        .split('.')
        .pop()
        .toLowerCase();

    var mime =
      'image/png';

    if (ext === 'jpg' ||
        ext === 'jpeg') {

      mime =
        'image/jpeg';

    } else if (ext === 'gif') {

      mime =
        'image/gif';

    } else if (ext === 'svg') {

      mime =
        'image/svg+xml';

    } else if (ext === 'webp') {

      mime =
        'image/webp';

    }

    var pos =
      getTransform(pic);

    var image =
      document.createElementNS(
        'http://www.w3.org/2000/svg',
        'image'
      );

    image.setAttribute(
      'x',
      pos.x
    );

    image.setAttribute(
      'y',
      pos.y
    );

    image.setAttribute(
      'width',
      pos.w
    );

    image.setAttribute(
      'height',
      pos.h
    );

    image.setAttribute(
      'href',
      'data:' +
      mime +
      ';base64,' +
      base64
    );

    image.setAttribute(
      'preserveAspectRatio',
      'none'
    );

    svgEl.appendChild(
      image
    );

  }

  /*
   * ==============================
   * SHAPE
   * ==============================
   */

  function renderShapeRect(
    svgEl,
    shape
  ) {

    var pos =
      getTransform(shape);

    var geometry =
      byTag(
        shape,
        'prstGeom'
      )[0];

    var geometryType =
      geometry
        ? attr(
            geometry,
            'prst'
          )
        : 'rect';

    var fill =
      getFillColor(shape) ||
      '#ffffff';

    var line =
      byTag(
        shape,
        'ln'
      )[0];

    var stroke =
      null;

    var strokeWidth =
      1;

    if (line) {

      var width =
        attr(
          line,
          'w'
        );

      if (width) {

        strokeWidth =
          emuToPx(width);

      }

      stroke =
        getFillColor(line);

    }

    var element;

    if (
      geometryType === 'ellipse' ||
      geometryType === 'oval'
    ) {

      element =
        document.createElementNS(
          'http://www.w3.org/2000/svg',
          'ellipse'
        );

      element.setAttribute(
        'cx',
        pos.x + pos.w / 2
      );

      element.setAttribute(
        'cy',
        pos.y + pos.h / 2
      );

      element.setAttribute(
        'rx',
        pos.w / 2
      );

      element.setAttribute(
        'ry',
        pos.h / 2
      );

    } else {

      element =
        document.createElementNS(
          'http://www.w3.org/2000/svg',
          'rect'
        );

      element.setAttribute(
        'x',
        pos.x
      );

      element.setAttribute(
        'y',
        pos.y
      );

      element.setAttribute(
        'width',
        pos.w
      );

      element.setAttribute(
        'height',
        pos.h
      );

    }

    element.setAttribute(
      'fill',
      fill
    );

    if (stroke) {

      element.setAttribute(
        'stroke',
        stroke
      );

      element.setAttribute(
        'stroke-width',
        strokeWidth
      );

    }

    svgEl.appendChild(
      element
    );

    return pos;

  }

  /*
   * ==============================
   * SHAPE TREE
   * ==============================
   */

  async function processShapes(
    svgEl,
    container,
    relsMap,
    slidePath
  ) {

    var children =
      container.children;

    for (
      var i = 0;
      i < children.length;
      i++
    ) {

      var node =
        children[i];

      var type =
        node.localName;

      if (type === 'grpSp') {

        await processShapes(
          svgEl,
          node,
          relsMap,
          slidePath
        );

      }

      else if (type === 'pic') {

        await renderPic(
          svgEl,
          node,
          relsMap,
          slidePath
        );

      }

      else if (type === 'sp') {

        var textBody =
          byTag(
            node,
            'txBody'
          )[0];

        if (textBody) {

          var pos =
            getTransform(node);

          var fill =
            getFillColor(node);

          if (fill) {

            var background =
              document.createElementNS(
                'http://www.w3.org/2000/svg',
                'rect'
              );

            background.setAttribute(
              'x',
              pos.x
            );

            background.setAttribute(
              'y',
              pos.y
            );

            background.setAttribute(
              'width',
              pos.w
            );

            background.setAttribute(
              'height',
              pos.h
            );

            background.setAttribute(
              'fill',
              fill
            );

            svgEl.appendChild(
              background
            );

          }

          renderTextShape(
            svgEl,
            node,
            pos.x + 8,
            pos.y + 4,
            pos.w,
            pos.h
          );

        }

        else {

          renderShapeRect(
            svgEl,
            node
          );

        }

      }

    }

  }

  /*
   * ==============================
   * RENDER SLIDE
   * ==============================
   */

  async function renderSlide(
    slidePath
  ) {

    var xml =
      await getXml(slidePath);

    if (!xml) {

      throw new Error(
        'Không đọc được slide: ' +
        slidePath
      );

    }

    var doc =
      xmlDoc(xml);

    var relsMap =
      await getSlideRels(
        slidePath
      );

    while (
      svg.firstChild
    ) {

      svg.removeChild(
        svg.firstChild
      );

    }

    var bg =
      byTag(
        doc,
        'bg'
      )[0];

    var backgroundColor =
      '#ffffff';

    if (bg) {

      var color =
        getFillColor(bg);

      if (color) {
        backgroundColor =
          color;
      }

    }

    var root =
      document.createElementNS(
        'http://www.w3.org/2000/svg',
        'rect'
      );

    root.setAttribute(
      'x',
      '0'
    );

    root.setAttribute(
      'y',
      '0'
    );

    root.setAttribute(
      'width',
      '100%'
    );

    root.setAttribute(
      'height',
      '100%'
    );

    root.setAttribute(
      'fill',
      backgroundColor
    );

    svg.appendChild(
      root
    );

    var spTree =
      byTag(
        doc,
        'spTree'
      )[0];

    if (spTree) {

      await processShapes(
        svg,
        spTree,
        relsMap,
        slidePath
      );

    }

  }

  /*
   * ==============================
   * SHOW SLIDE
   * ==============================
   */

  async function showSlide(
    index
  ) {

    if (!slides.length) {
      return;
    }

    currentSlide =
      Math.max(
        0,
        Math.min(
          slides.length - 1,
          index
        )
      );

    try {

      await renderSlide(
        slides[currentSlide]
      );

      $('counter').textContent =
        (currentSlide + 1) +
        ' / ' +
        slides.length;

    }

    catch (error) {

      console.error(
        'Slide render error:',
        error
      );

      showError(
        'Không thể hiển thị slide ' +
        (currentSlide + 1) +
        '. ' +
        (
          error.message ||
          'Lỗi không xác định.'
        )
      );

    }

  }

  /*
   * ==============================
   * LOAD BUFFER
   * ==============================
   */

  async function loadFromBuffer(
    buffer,
    filename
  ) {

    try {

      showLoading(
        'Đang giải nén PPTX'
      );

      if (
        !buffer ||
        buffer.byteLength === 0
      ) {

        throw new Error(
          'File PPTX rỗng.'
        );

      }

      zip =
        await JSZip.loadAsync(
          buffer
        );

      await readPresentation();

      slides =
        await getSlidePaths();

      if (!slides.length) {

        throw new Error(
          'Không tìm thấy slide nào trong file PPTX.'
        );

      }

      if (filename) {

        $('brand-text').textContent =
          'Moon Studio — ' +
          filename.replace(
            /\.pptx$/i,
            ''
          );

      }

      currentSlide =
        0;

      zoom =
        1;

      applyZoom();

      await showSlide(0);

      hideLoading();

      $('dropzone').style.display =
        'none';

      $('error').style.display =
        'none';

    }

    catch (error) {

      console.error(
        'PPTX loading error:',
        error
      );

      showError(
        error.message ||
        'Có lỗi khi đọc file PPTX.'
      );

    }

  }

  /*
   * ==============================
   * LOAD URL
   * ==============================
   *
   * Quan trọng:
   * File phải trả về PPTX thật.
   * Không được trả HTML/404.
   */

  async function loadFromUrl() {

    try {

      showLoading(
        'Đang tải từ link'
      );

      var response;

      try {

        response =
          await fetch(
            PPTX_URL,
            {
              method: 'GET',
              cache: 'no-store',
              credentials: 'omit',
              mode: 'cors'
            }
          );

      }

      catch (fetchError) {

        throw new Error(
          'Failed to fetch — trình duyệt không thể tải file từ URL. ' +
          'Kiểm tra CORS hoặc Cloudflare Worker.'
        );

      }

      if (!response.ok) {

        throw new Error(
          'HTTP ' +
          response.status +
          ' — Không tải được file PPTX.'
        );

      }

      var contentType =
        (
          response.headers.get(
            'content-type'
          ) || ''
        ).toLowerCase();

      /*
       * Nếu Worker trả HTML thay vì PPTX,
       * báo lỗi rõ ràng.
       */

      if (
        contentType.indexOf(
          'text/html'
        ) !== -1
      ) {

        throw new Error(
          'Server đang trả HTML thay vì file PPTX. ' +
          'Hãy kiểm tra route /khoahoctunhien6.pptx trong Worker.'
        );

      }

      var buffer =
        await response.arrayBuffer();

      if (
        !buffer ||
        buffer.byteLength === 0
      ) {

        throw new Error(
          'Server trả về file PPTX rỗng.'
        );

      }

      /*
       * Kiểm tra ZIP signature.
       * PPTX thực chất là ZIP.
       */

      var bytes =
        new Uint8Array(
          buffer.slice(0, 4)
        );

      var isZip =
        bytes.length >= 4 &&
        bytes[0] === 0x50 &&
        bytes[1] === 0x4b &&
        (
          bytes[2] === 0x03 ||
          bytes[2] === 0x05 ||
          bytes[2] === 0x07
        );

      if (!isZip) {

        throw new Error(
          'URL không trả về PPTX hợp lệ. ' +
          'File nhận được không có định dạng ZIP/PPTX.'
        );

      }

      await loadFromBuffer(
        buffer,
        PPTX_FILENAME
      );

    }

    catch (error) {

      console.error(
        'URL loading error:',
        error
      );

      showDropzone(
        error.message ||
        'Không tải được từ link.'
      );

    }

  }

  /*
   * ==============================
   * LOCAL FILE
   * ==============================
   */

  function openLocalFile() {

    $('fileInput').click();

  }

  $('openFile')
    .addEventListener(
      'click',
      openLocalFile
    );

  $('errorRetry')
    .addEventListener(
      'click',
      openLocalFile
    );

  $('fileInput')
    .addEventListener(
      'change',
      function (event) {

        var file =
          event.target.files[0];

        if (!file) {
          return;
        }

        if (
          !/\.pptx$/i.test(
            file.name
          )
        ) {

          showError(
            'Vui lòng chọn file có đuôi .pptx'
          );

          return;

        }

        showLoading(
          'Đang đọc file'
        );

        var reader =
          new FileReader();

        reader.onload =
          function (event) {

            loadFromBuffer(
              event.target.result,
              file.name
            );

          };

        reader.onerror =
          function () {

            showError(
              'Không thể đọc file từ thiết bị.'
            );

          };

        reader.readAsArrayBuffer(
          file
        );

      }
    );

  /*
   * ==============================
   * DRAG & DROP
   * ==============================
   */

  var dropzone =
    $('dropzone');

  [
    'dragenter',
    'dragover'
  ].forEach(
    function (eventName) {

      $('viewport')
        .addEventListener(
          eventName,
          function (event) {

            event.preventDefault();

            dropzone.classList.add(
              'dragover'
            );

          }
        );

    }
  );

  [
    'dragleave',
    'drop'
  ].forEach(
    function (eventName) {

      $('viewport')
        .addEventListener(
          eventName,
          function (event) {

            event.preventDefault();

            dropzone.classList.remove(
              'dragover'
            );

          }
        );

    }
  );

  $('viewport')
    .addEventListener(
      'drop',
      function (event) {

        var file =
          event.dataTransfer.files[0];

        if (!file) {
          return;
        }

        if (
          !/\.pptx$/i.test(
            file.name
          )
        ) {

          showError(
            'Vui lòng kéo thả file .pptx'
          );

          return;

        }

        showLoading(
          'Đang đọc file'
        );

        var reader =
          new FileReader();

        reader.onload =
          function (event) {

            loadFromBuffer(
              event.target.result,
              file.name
            );

          };

        reader.readAsArrayBuffer(
          file
        );

      }
    );

  dropzone
    .addEventListener(
      'click',
      openLocalFile
    );

  /*
   * ==============================
   * NAVIGATION
   * ==============================
   */

  $('previous')
    .addEventListener(
      'click',
      function () {

        showSlide(
          currentSlide - 1
        );

      }
    );

  $('next')
    .addEventListener(
      'click',
      function () {

        showSlide(
          currentSlide + 1
        );

      }
    );

  /*
   * ==============================
   * KEYBOARD
   * ==============================
   */

  document.addEventListener(
    'keydown',
    function (event) {

      if (
        event.key === 'ArrowLeft'
      ) {

        showSlide(
          currentSlide - 1
        );

      }

      if (
        event.key === 'ArrowRight' ||
        event.key === ' '
      ) {

        event.preventDefault();

        showSlide(
          currentSlide + 1
        );

      }

      if (
        event.key === 'Escape' &&
        document.fullscreenElement
      ) {

        document.exitFullscreen();

      }

    }
  );

  /*
   * ==============================
   * TOUCH SWIPE
   * ==============================
   */

  var touchX = 0;

  $('viewport')
    .addEventListener(
      'touchstart',
      function (event) {

        if (
          event.touches &&
          event.touches.length
        ) {

          touchX =
            event.touches[0].clientX;

        }

      },
      {
        passive: true
      }
    );

  $('viewport')
    .addEventListener(
      'touchend',
      function (event) {

        if (
          !event.changedTouches ||
          !event.changedTouches.length
        ) {
          return;
        }

        var delta =
          event.changedTouches[0].clientX -
          touchX;

        if (
          Math.abs(delta) > 50
        ) {

          if (delta < 0) {

            showSlide(
              currentSlide + 1
            );

          } else {

            showSlide(
              currentSlide - 1
            );

          }

        }

      },
      {
        passive: true
      }
    );

  /*
   * ==============================
   * ZOOM
   * ==============================
   */

  function applyZoom() {

    stage.style.transform =
      'scale(' +
      zoom +
      ')';

    $('zoomReset').textContent =
      Math.round(
        zoom * 100
      ) + '%';

  }

  $('zoomIn')
    .addEventListener(
      'click',
      function () {

        zoom =
          Math.min(
            1.8,
            zoom + 0.1
          );

        applyZoom();

      }
    );

  $('zoomOut')
    .addEventListener(
      'click',
      function () {

        zoom =
          Math.max(
            0.4,
            zoom - 0.1
          );

        applyZoom();

      }
    );

  $('zoomReset')
    .addEventListener(
      'click',
      function () {

        zoom =
          1;

        applyZoom();

      }
    );

  /*
   * ==============================
   * FULLSCREEN
   * ==============================
   */

  $('fullscreen')
    .addEventListener(
      'click',
      async function () {

        try {

          var app =
            $('pptx-app');

          if (
            !document.fullscreenElement
          ) {

            if (
              app.requestFullscreen
            ) {

              await app.requestFullscreen();

            }

          } else {

            await document.exitFullscreen();

          }

        }

        catch (error) {

          console.error(
            'Fullscreen error:',
            error
          );

        }

      }
    );

  /*
   * ==============================
   * START
   * ==============================
   */

  showLoading(
    'Đang tải PPTX'
  );

  loadFromUrl();

})();
</script>
